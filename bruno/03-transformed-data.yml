info:
  name: R2 | GET /transformed_data
  type: http
  seq: 3

http:
  method: GET
  url: http://{{baseUrl}}/transformed_data
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('GET /transformed_data : 200 et JSON non vide', () => { expect(res.getStatus()).to.equal(200); expect(Object.keys(res.getBody()).length).to.be.above(0); });
        console.log('transformed_data : ' + JSON.stringify(res.getBody()).slice(0, 600));
        console.log('À vérifier : la somme des produits par catégorie = produits chargés (extracted_data : ' + bru.getCollectionVar('off_extracted') + ').');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
