import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask
import groovy.xml.XmlParser
import org.gradle.api.file.ConfigurableFileCollection
import org.gradle.api.logging.Logger
import org.gradle.api.tasks.Classpath
import org.gradle.api.tasks.testing.TestDescriptor
import org.gradle.api.tasks.testing.TestListener
import org.gradle.api.tasks.testing.TestResult
import org.gradle.process.CommandLineArgumentProvider

abstract class MockitoAgentArgumentProvider implements CommandLineArgumentProvider {
    @Classpath
    abstract ConfigurableFileCollection getAgentClasspath()

    @Override
    Iterable<String> asArguments() {
        ["-javaagent:${agentClasspath.singleFile.absolutePath}"]
    }
}

class TestSummaryListener implements TestListener {
    private final Logger logger
    private final String taskPath

    TestSummaryListener(Logger logger, String taskPath) {
        this.logger = logger
        this.taskPath = taskPath
    }

    @Override
    void beforeSuite(TestDescriptor suite) {}

    @Override
    void afterSuite(TestDescriptor suite, TestResult result) {
        if (suite.parent == null) {
            logger.lifecycle(
                "${taskPath}: ${result.resultType} " +
                    "(${result.testCount} tests, ${result.successfulTestCount} passed, " +
                    "${result.failedTestCount} failed, ${result.skippedTestCount} skipped)"
            )
        }
    }

    @Override
    void beforeTest(TestDescriptor testDescriptor) {}

    @Override
    void afterTest(TestDescriptor testDescriptor, TestResult result) {}
}

plugins {
    id 'application'
    id 'jacoco'
    id 'pmd'
    id 'com.diffplug.spotless' version '8.10.2'
    id 'com.github.spotbugs' version '6.5.11'
}

group = 'ca.ulaval.glo4003'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'ca.ulaval.glo4003.ProjectDBMain'
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.35.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

jacoco {
    toolVersion = '0.8.13'
}

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
    doLast {
        def report = file("${jacoco.reportsDirectory.get()}/test/jacocoTestReport.xml")
        if (report.exists()) {
            def parser = new XmlParser()
            parser.setFeature('http://apache.org/xml/features/nonvalidating/load-external-dtd', false)
            parser.setFeature('http://apache.org/xml/features/disallow-doctype-decl', false)
            def counter = parser.parse(report).counter.find { it.@type == 'INSTRUCTION' }
            if (counter != null) {
                def missed = counter.@missed.toDouble()
                def covered = counter.@covered.toDouble()
                def percentage = covered / (missed + covered) * 100
                logger.lifecycle(String.format('Total coverage: %.2f%%', percentage))
            }
        }
    }
}

spotbugs {
    toolVersion = '4.9.6'
    // Groovy DSL requires valueOf(String) for these Kotlin enums.
    effort = Effort.valueOf('MAX')
    reportLevel = Confidence.valueOf('MEDIUM')
    excludeFilter = file("${rootDir}/config/spotbugs/exclude.xml")
    // Analyse only production code; test doubles and fixtures generate noise.
    ignoreFailures = false
}

tasks.named('spotbugsTest') {
    enabled = false
}

tasks.withType(SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = true
    }
}

pmd {
    toolVersion = '7.27.0'
    // Use a curated, low-noise ruleset instead of the full default set.
    ruleSets = []
    ruleSetFiles = files("${rootDir}/config/pmd/ruleset.xml")
    // Print violations to the console instead of only writing report files.
    consoleOutput = true
    // Analyse production code only; skip tests to avoid noise from fixtures.
    ignoreFailures = false
}

// PMD temporarily disabled: skip all PMD tasks so it doesn't run or fail the build.
tasks.withType(Pmd).configureEach {
    enabled = false
}

def mockitoVersion = '5.23.0'
def mockitoAgent = configurations.create('mockitoAgent') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}

dependencies {
    implementation 'org.glassfish.jersey.containers:jersey-container-jetty-http:4.0.2'
    implementation 'org.glassfish.jersey.inject:jersey-hk2:4.0.2'
    implementation 'org.glassfish.jersey.media:jersey-media-json-jackson:4.0.2'
    implementation 'com.google.guava:guava:33.6.0-jre'
    implementation 'org.slf4j:slf4j-api:2.0.18'
    implementation 'at.favre.lib:bcrypt:0.10.2'

    runtimeOnly 'org.slf4j:slf4j-simple:2.0.18'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'io.rest-assured:rest-assured:6.0.1'
    testImplementation 'org.awaitility:awaitility:4.3.0'

    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    add('mockitoAgent', "org.mockito:mockito-core:${mockitoVersion}")
}

def mockitoAgentArgumentProvider = objects.newInstance(MockitoAgentArgumentProvider)
mockitoAgentArgumentProvider.agentClasspath.from(mockitoAgent)

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgumentProviders.add(mockitoAgentArgumentProvider)
    // L'instrumentation de Mockito étend le classpath d'amorçage, ce qui est incompatible avec le partage de données de classe.
    jvmArgs '-Xshare:off'

    reports {
        junitXml.required = true
        html.required = true
    }

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }

    addTestListener(new TestSummaryListener(logger, path))
}

tasks.named('test') {
    exclude '**/*IT.class'
}

tasks.register('integrationTest', Test) {
    description = 'Runs the integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*IT.class'
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}
