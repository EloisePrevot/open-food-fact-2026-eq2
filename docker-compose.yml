services:
  # API REST Java.
  backend:
    build:
      context: ./backend
    ports:
      - "80:8080"
    environment:
      MONGODB_URI: mongodb://root:root@mongodb:27017/?authSource=admin
      MONGODB_DATABASE: open_food_facts
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6334"
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/open_food_facts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      - mongodb
      - qdrant
      - postgres

  # SPA React servie par nginx.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # URL du backend telle que vue par le navigateur (port publié sur l'hôte).
        VITE_API_BASE_URL: http://localhost:80
    ports:
      - "8081:80"
    depends_on:
      - backend

  # Base vectorielle pour les embeddings.
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # API REST/HTTP
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongodb_data:/data/db

  # Base relationnelle pour les données brutes.
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: open_food_facts
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Fichiers sources en lecture seule pour le COPY côté serveur (ex. off.csv).
      - ./elt/raw:/raw:ro

volumes:
  qdrant_data:
  mongodb_data:
  postgres_data:
