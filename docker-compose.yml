services:
  # API REST Java.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "80:8080"
    environment:
      MONGODB_URI: mongodb://root:root@mongodb:27017/?authSource=admin
      MONGODB_DATABASE: open_food_facts
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6334"
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/open_food_facts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/open_food_facts
      ELT_AU_DEMARRAGE: "true"
      ELT_LIMITE: "5000"
      ELT_RAW_DIRECTORY: /app/elt/raw
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./elt/raw:/app/elt/raw:ro
    depends_on:
      postgres:
        condition: service_healthy
      mongo-restore:
        condition: service_completed_successfully
      qdrant:
        condition: service_started

  # SPA React servie par nginx.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # URL du backend telle que vue par le navigateur (port publié sur l'hôte).
        VITE_API_BASE_URL: http://localhost:80
    ports:
      - "8081:80"
    depends_on:
      - backend

  # Télécharge une seule fois les données déjà préparées (snapshots Qdrant et dump MongoDB).
  snapshots:
    image: curlimages/curl:8.11.1
    user: "0:0"
    entrypoint: ["sh", "/scripts/fetch-snapshots.sh"]
    environment:
      SNAPSHOTS_URL: ${SNAPSHOTS_URL:-https://github.com/EloisePrevot/open-food-fact-2026-eq2/releases/download/snapshots}
    volumes:
      - snapshots:/snapshots
      - ./docker/snapshots/fetch-snapshots.sh:/scripts/fetch-snapshots.sh:ro

  # Base vectorielle pour les embeddings, restaurée depuis les snapshots si elle est vide.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    entrypoint: ["sh", "/scripts/start-with-snapshots.sh"]
    ports:
      - "6333:6333" # API REST/HTTP
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
      - snapshots:/snapshots:ro
      - ./docker/qdrant/start-with-snapshots.sh:/scripts/start-with-snapshots.sh:ro
    depends_on:
      snapshots:
        condition: service_completed_successfully

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "mongodb://root:root@mongodb:27017/?authSource=admin", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Restaure le dump MongoDB publié si la base est vide.
  mongo-restore:
    image: mongo:8
    entrypoint: ["sh", "/scripts/restore.sh"]
    environment:
      MONGODB_URI: mongodb://root:root@mongodb:27017/?authSource=admin
      MONGODB_DATABASE: open_food_facts
    volumes:
      - snapshots:/snapshots:ro
      - ./docker/mongo/restore.sh:/scripts/restore.sh:ro
    depends_on:
      mongodb:
        condition: service_healthy
      snapshots:
        condition: service_completed_successfully

  # Exporte MongoDB vers elt/snapshots/ : docker compose run --rm mongo-dump
  mongo-dump:
    image: mongo:8
    profiles: ["export"]
    entrypoint: ["sh", "/scripts/dump.sh"]
    environment:
      MONGODB_URI: mongodb://root:root@mongodb:27017/?authSource=admin
      MONGODB_DATABASE: open_food_facts
    volumes:
      - ./elt/snapshots:/export
      - ./docker/mongo/dump.sh:/scripts/dump.sh:ro
    depends_on:
      mongodb:
        condition: service_healthy

  # Base relationnelle pour les données brutes.
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: open_food_facts
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "open_food_facts"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  qdrant_data:
  snapshots:
  mongodb_data:
  postgres_data:
